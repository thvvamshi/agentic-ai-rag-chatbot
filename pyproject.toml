[project]
name = "rag-agentic-ai"
version = "0.1.0"
description = "LangGraph and Pinecone RAG chatbot for Agentic AI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<0.130",
    "fonttools>=4.66.1",
    "ftfy>=6.3.1",
    "langchain>=1.4.3",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-pinecone>=0.2.13",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.12",
    "pinecone>=7.3.0",
    "pydantic>=2.10,<2.13",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.3",
    "rank-bm25>=0.2.2",
    "requests>=2.34.2",
    "sentence-transformers>=6.1.0",
    "starlette>=0.40,<0.50",
    "streamlit>=1.64.0",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false